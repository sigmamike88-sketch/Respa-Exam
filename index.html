<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alif Med — Past Year Exams</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-2: #161b22;
    --bg-3: #1c2230;
    --card: #151b26;
    --border: #232b3a;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #e91e63;
    --accent-2: #7c4dff;
    --green: #2ecc71;
    --green-bg: #143d29;
    --red: #e74c3c;
    --red-bg: #3d1a1a;
    --blue: #4d9fff;
    --radius: 14px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  #app { min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 70px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    position: sticky; top: 0; z-index: 20;
    background: rgba(13,17,23,0.95);
    backdrop-filter: blur(10px);
  }
  .logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo-badge {
    width: 34px; height: 34px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #7c4dff, #4d9fff);
    display: grid; place-items: center;
    font-weight: 700; font-size: 11px; color: #fff;
  }
  .logo-text { font-size: 18px; font-weight: 700; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--bg-3); border: 1px solid var(--border);
    display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--text-dim);
  }

  .search-wrap {
    margin: 6px 16px 14px;
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
  }
  .search-wrap svg { flex-shrink: 0; opacity: 0.6; }
  .search-wrap input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-size: 14px;
  }
  .search-wrap input::placeholder { color: var(--text-dim); }

  .tabs {
    display: flex; gap: 8px;
    margin: 0 16px 16px;
    background: var(--bg-2);
    padding: 6px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  .tab {
    flex: 1; padding: 10px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600; color: var(--text-dim);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .tab.active { background: var(--bg-3); color: var(--text); }

  .list { padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }
  .exam-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: left;
    width: 100%;
    transition: transform 0.15s, border-color 0.2s;
  }
  .exam-card:active { transform: scale(0.985); }
  .exam-card:hover { border-color: var(--accent); }
  .exam-thumb {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--bg-3); border: 1px solid var(--border);
    display: grid; place-items: center; flex-shrink: 0;
    font-size: 20px;
  }
  .exam-body { flex: 1; min-width: 0; }
  .exam-tags { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 10px; font-weight: 700; letter-spacing: 0.6px;
    padding: 3px 8px; border-radius: 6px; text-transform: uppercase;
  }
  .tag.subject { color: #ff8bc4; background: rgba(233,30,99,0.12); }
  .tag.topic { color: var(--blue); background: rgba(77,159,255,0.12); }
  .exam-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
  .exam-meta { font-size: 12px; color: var(--text-dim); }
  .progress-bar {
    margin-top: 8px; height: 4px; background: var(--bg-3); border-radius: 2px; overflow: hidden;
  }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 14px; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(13,17,23,0.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-around;
    padding: 8px 0 10px;
    z-index: 30;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; color: var(--text-dim); font-weight: 600;
    padding: 4px 12px;
  }
  .nav-item.active { color: var(--accent); }
  .nav-item svg { width: 22px; height: 22px; }

  /* QUIZ */
  .quiz-header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    position: sticky; top: 0; z-index: 20;
    background: rgba(13,17,23,0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--bg-3); border: 1px solid var(--border);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .icon-btn:active { background: var(--border); }
  .quiz-header-info { flex: 1; text-align: center; }
  .quiz-header-title { font-size: 14px; font-weight: 700; }
  .quiz-header-count { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

  .quiz-body { padding: 16px; flex: 1; }
  .breadcrumb {
    font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
    color: var(--text-dim); text-transform: uppercase;
    margin-bottom: 6px;
  }
  .breadcrumb .dot { color: var(--accent); margin: 0 6px; }
  .quiz-title { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
  .quiz-section {
    font-size: 13px; color: var(--text-dim); font-style: italic;
    padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 20px;
  }

  .q-tag-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .q-number { font-size: 13px; font-weight: 700; color: var(--text-dim); }
  .q-topic {
    font-size: 10px; font-weight: 700; letter-spacing: 0.6px;
    padding: 3px 8px; border-radius: 6px;
    color: var(--blue); background: rgba(77,159,255,0.12);
    text-transform: uppercase; margin-left: 8px;
  }

  .q-text { font-size: 17px; font-weight: 600; line-height: 1.55; margin-bottom: 20px; }

  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .option {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    text-align: left;
    font-size: 14px; line-height: 1.5;
    color: var(--text);
    transition: all 0.2s;
    width: 100%;
  }
  .option:hover:not(.locked) { border-color: var(--accent); }
  .option .letter {
    width: 26px; height: 26px; border-radius: 8px;
    background: var(--bg-3); border: 1px solid var(--border);
    display: grid; place-items: center;
    font-size: 12px; font-weight: 700; color: var(--text-dim);
    flex-shrink: 0;
  }
  .option.correct { background: var(--green-bg); border-color: var(--green); }
  .option.correct .letter { background: var(--green); color: #fff; border-color: var(--green); }
  .option.wrong { background: var(--red-bg); border-color: var(--red); }
  .option.wrong .letter { background: var(--red); color: #fff; border-color: var(--red); }
  .option.locked { cursor: default; }

  .result-row { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; margin-bottom: 16px; }
  .result-row.correct { color: var(--green); }
  .result-row.wrong { color: var(--red); }

  .action-btns { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .action-btn {
    padding: 10px 18px; border-radius: 999px;
    background: var(--bg-3); border: 1px solid var(--border);
    font-size: 13px; font-weight: 600;
  }
  .action-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .explanation {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 20px;
  }
  .explanation-label {
    font-size: 11px; font-weight: 800; letter-spacing: 1px;
    color: var(--blue); text-transform: uppercase;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .explanation-label::before {
    content: ''; width: 18px; height: 2px; background: var(--blue); border-radius: 1px;
  }
  .explanation-text { font-size: 14px; line-height: 1.7; color: #c9d1d9; }
  .explanation-text strong { color: var(--text); }

  .related { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 12px; color: var(--text-dim); }
  .related-btn {
    padding: 5px 12px; border-radius: 8px;
    background: var(--bg-3); border: 1px solid var(--border);
    font-size: 11px; font-weight: 600; color: var(--text);
  }

  .nav-buttons { display: flex; gap: 10px; margin-top: 8px; }
  .nav-btn {
    flex: 1; padding: 14px; border-radius: var(--radius);
    font-size: 14px; font-weight: 700;
    background: var(--bg-3); border: 1px solid var(--border);
  }
  .nav-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .q-nav {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px;
    padding: 14px; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius);
  }
  .q-nav-btn {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--bg-3); border: 1px solid var(--border);
    font-size: 12px; font-weight: 700; color: var(--text-dim);
  }
  .q-nav-btn.current { background: var(--accent); color: #fff; border-color: var(--accent); }
  .q-nav-btn.answered-correct { background: var(--green-bg); color: var(--green); border-color: var(--green); }
  .q-nav-btn.answered-wrong { background: var(--red-bg); color: var(--red); border-color: var(--red); }

  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--bg-3); border: 1px solid var(--border);
    padding: 12px 20px; border-radius: 12px;
    font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: all 0.3s;
    z-index: 100; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (min-width: 700px) {
    #app { max-width: 640px; margin: 0 auto; }
    .bottom-nav { max-width: 640px; left: 50%; transform: translateX(-50%); }
  }
</style>
</head>

<div class="toast" id="toast"></div>

const QUIZ_DATA = [
  {
    id: "anatomy-2018",
    subject: "Anatomy",

    icon: "🫀",
    section: "PLATE I — Histology of vessels",
    questions: [
      {
        q: "Select the correct description about the wall of the cardiovascular system:",
        options: [
          { letter: "A", text: "Arteries are characterized by a more developed tunica adventitia than their corresponding veins." },
          { letter: "B", text: "Tunica intima and media are well-developed and thicker in veins than their corresponding arteries." },
          { letter: "C", text: "Endocardium of the heart is homologous with the tunica media of blood vessels." },
          { letter: "D", text: "Arterioles lack a subendothelial connective tissue layer and internal and external elastic laminae." },
          { letter: "E", text: "Arteries have a wider lumen relative to the thickness of their walls." }
        ],
        correct: "D",
        explanation: "<strong>Arterioles</strong> are the smallest arteries and have a simplified structure. They <strong>lack a subendothelial connective tissue layer</strong> and lack distinct <strong>internal and external elastic laminae</strong>. This structural simplification allows them to function as <strong>resistance vessels</strong> — their diameter changes to regulate blood pressure and flow into capillaries.<br><br><strong>Clinical relevance:</strong> In hypertension, arterioles undergo <strong>hyaline arteriosclerosis</strong> (thickening of the vessel wall, narrowing of the lumen) causing end-organ damage (kidney: nephrosclerosis; brain: lacunar infarcts).",
        related: ["Q11", "Q13"]
      },
      {

        options: [
          { letter: "A", text: "Simple squamous epithelium (endothelium)" },

        ],
        correct: "D",
        explanation: "The cardiovascular system is composed of <strong>endothelium</strong> (simple squamous epithelium), <strong>smooth muscle</strong> (tunica media of vessels), <strong>cardiac muscle</strong> (in the heart), and <strong>elastic connective tissue</strong> (large arteries). <strong>Reticular connective tissue</strong> is characteristic of lymphoid organs (lymph nodes, spleen, bone marrow), not the cardiovascular system."
      },
      {
        q: "Which layer of the blood vessel wall is responsible for vasoconstriction and vasodilation?",

          { letter: "A", text: "Tunica intima" },
          { letter: "B", text: "Tunica media" },
          { letter: "C", text: "Tunica adventitia" },
          { letter: "D", text: "Endocardium" },
          { letter: "E", text: "Subendothelial layer" }
        ],
        correct: "B",
        explanation: "The <strong>tunica media</strong> is the middle layer of the blood vessel wall and is composed primarily of <strong>smooth muscle cells</strong> and elastic fibers. It is responsible for <strong>vasoconstriction and vasodilation</strong>, regulating vessel diameter, blood pressure, and blood flow."
      },
      {
        q: "The vasa vasorum are found primarily in which layer of large blood vessels?",
        options: [
          { letter: "A", text: "Tunica intima" },
          { letter: "B", text: "Tunica media" },
          { letter: "C", text: "Tunica adventitia" },
          { letter: "D", text: "Endothelium" },
          { letter: "E", text: "Basement membrane" }
        ],
        correct: "C",
        explanation: "<strong>Vasa vasorum</strong> (\"vessels of the vessels\") are small blood vessels that supply the walls of large arteries and veins. They are found primarily in the <strong>tunica adventitia</strong> and the outer part of the tunica media, since these layers are too thick to be nourished by diffusion from the lumen alone."
      },
      {
        q: "Which type of capillaries are characterized by the presence of pores (fenestrations) in their endothelial cells?",
        options: [
          { letter: "A", text: "Continuous capillaries" },
          { letter: "B", text: "Fenestrated capillaries" },
          { letter: "C", text: "Sinusoidal capillaries" },
          { letter: "D", text: "Lymphatic capillaries" },
          { letter: "E", text: "Arteriovenous capillaries" }
        ],
        correct: "B",
        explanation: "<strong>Fenestrated capillaries</strong> have <strong>pores (fenestrations)</strong> in their endothelial cells that allow rapid exchange of fluids and small molecules. They are found in organs with high absorption or filtration, such as the <strong>kidney, intestines, and endocrine glands</strong>."
      },
      {
        q: "The endocardium is homologous to which layer of blood vessels?",
        options: [
          { letter: "A", text: "Tunica adventitia" },
          { letter: "B", text: "Tunica media" },
          { letter: "C", text: "Tunica intima" },
          { letter: "D", text: "Vasa vasorum" },
          { letter: "E", text: "Myocardium" }
        ],
        correct: "C",
        explanation: "The <strong>endocardium</strong> is the innermost layer of the heart wall and is <strong>homologous to the tunica intima</strong> of blood vessels. Both consist of an endothelium, a subendothelial layer, and in some cases an internal elastic lamina."
      },
      {
        q: "Which of the following is the largest artery in the human body?",
        options: [
          { letter: "A", text: "Pulmonary artery" },
          { letter: "B", text: "Aorta" },
          { letter: "C", text: "Carotid artery" },
          { letter: "D", text: "Femoral artery" },
          { letter: "E", text: "Renal artery" }
        ],
        correct: "B",
        explanation: "The <strong>aorta</strong> is the largest artery in the human body. It arises from the left ventricle and distributes oxygenated blood to all parts of the body. It is an elastic artery with many elastic lamellae in its tunica media."
      },
      {
        q: "Which of the following statements about veins is correct?",
        options: [
          { letter: "A", text: "Veins have a thicker tunica media than arteries." },
          { letter: "B", text: "Veins have a thinner tunica media and a thicker tunica adventitia than arteries." },
          { letter: "C", text: "Veins lack a tunica intima." },
          { letter: "D", text: "Veins have no valves." },
          { letter: "E", text: "Veins contain more elastic fibers than arteries." }
        ],
        correct: "B",
        explanation: "Compared with arteries, <strong>veins have a thinner tunica media</strong> and a <strong>thicker tunica adventitia</strong>. Veins also have a <strong>wider lumen</strong> and often contain <strong>valves</strong> (especially in the lower limbs) to prevent backflow."
      },
      {
        q: "Purkinje fibers are specialized cardiac muscle cells that are primarily responsible for:",
        options: [
          { letter: "A", text: "Secreting hormones" },
          { letter: "B", text: "Conducting electrical impulses rapidly through the heart" },
          { letter: "C", text: "Contracting to pump blood out of the heart" },
          { letter: "D", text: "Forming the fibrous skeleton of the heart" },
          { letter: "E", text: "Storing glycogen only" }
        ],
        correct: "B",
        explanation: "<strong>Purkinje fibers</strong> are specialized cardiac muscle cells that form the conduction system of the heart. They are responsible for <strong>rapidly conducting electrical impulses</strong> from the AV node to the ventricular myocardium, ensuring coordinated contraction."
      },
      {
        q: "Which of the following is NOT a characteristic of cardiac muscle?",
        options: [
          { letter: "A", text: "Striated appearance" },
          { letter: "B", text: "Single centrally located nucleus" },
          { letter: "C", text: "Intercalated discs" },
          { letter: "D", text: "Voluntary control" },
          { letter: "E", text: "Branching fibers" }
        ],
        correct: "D",
        explanation: "Cardiac muscle is <strong>involuntary</strong> — it is not under conscious control. Its characteristics include a <strong>striated appearance</strong>, <strong>single centrally located nucleus</strong>, <strong>intercalated discs</strong>, and <strong>branching fibers</strong>."
      }
    ]
  }

/* ============ STATE ============ */
const STORAGE_KEY = "alif_med_progress_v1";
const state = {
  view: "home",
  activeTab: "modules",
  search: "",
  exam: null,
  qIndex: 0,
  showExplanation: false,
  progress: loadProgress()
};

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}
function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress)); } catch {}
}

function getExamProgress(exam) {
  const p = state.progress[exam.id] || {};
  const answered = Object.keys(p).length;
  const correct = Object.values(p).filter(v => v.correct).length;
  return { answered, correct, total: exam.questions.length };
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ============ RENDER ============ */
const app = document.getElementById("app");

function render() {
  if (state.view === "home") renderHome();
  else renderQuiz();
}

function renderHome() {
  const filtered = QUIZ_DATA.filter(exam => {
    const q = state.search.toLowerCase();
    if (!q) return true;
    return exam.title.toLowerCase().includes(q)
      || exam.subject.toLowerCase().includes(q)
      || exam.topic.toLowerCase().includes(q)
      || String(exam.year).includes(q);
  });

  const cardsHTML = filtered.length === 0
    ? `<div class="empty-state">No exams match "${escapeHtml(state.search)}"</div>`
    : filtered.map(exam => {
        const p = getExamProgress(exam);
        const pct = p.total ? Math.round((p.answered / p.total) * 100) : 0;
        return `
          <button class="exam-card" data-exam-id="${exam.id}">
            <div class="exam-thumb">${exam.icon || "📘"}</div>
            <div class="exam-body">
              <div class="exam-tags">
                <span class="tag subject">${escapeHtml(exam.subject)}</span>
                <span class="tag topic">${escapeHtml(exam.topic)}</span>
              </div>
              <div class="exam-title">${escapeHtml(exam.title)}</div>
              <div class="exam-meta">
                ${p.answered > 0
                  ? `${p.answered} / ${p.total} answered · ${p.correct} correct`
                  : `${p.total} questions`}
              </div>
              ${p.answered > 0 ? `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>` : ""}
            </div>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-dim);flex-shrink:0;"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        `;
      }).join("");

  app.innerHTML = `
    <header class="topbar">
      <div class="logo-wrap">
        <div class="logo-badge">AM</div>
        <div class="logo-text">Alif Med</div>
      </div>
      <div class="avatar">MD</div>
    </header>

    <div class="search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="searchInput" type="text" placeholder="Search quizzes or subjects..." value="${escapeHtml(state.search)}" />
    </div>

    <div class="tabs">
      <button class="tab ${state.activeTab === "modules" ? "active" : ""}" data-tab="modules">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        Modules
      </button>
      <button class="tab ${state.activeTab === "subjects" ? "active" : ""}" data-tab="subjects">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        Subjects
      </button>
    </div>

    <div class="list">${cardsHTML}</div>

    <nav class="bottom-nav">
      <div class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1V9.5z"/></svg>
        Home
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v4H4zM4 10h16v4H4zM4 16h16v4H4z"/></svg>
        Exams
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 01-11.5 7.2L3 21l1.8-6.5A8 8 0 1121 12z"/></svg>
        Chat
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        Progress
      </div>
    </nav>
  `;

  // events
  const searchInput = document.getElementById("searchInput");
  searchInput.addEventListener("input", e => {
    state.search = e.target.value;
    const filtered2 = QUIZ_DATA.filter(exam => {
      const q = state.search.toLowerCase();
      if (!q) return true;
      return exam.title.toLowerCase().includes(q)
        || exam.subject.toLowerCase().includes(q)
        || exam.topic.toLowerCase().includes(q)
        || String(exam.year).includes(q);
    });
    const list = document.querySelector(".list");
    list.innerHTML = filtered2.length === 0
      ? `<div class="empty-state">No exams match "${escapeHtml(state.search)}"</div>`
      : filtered2.map(exam => {
          const p = getExamProgress(exam);
          const pct = p.total ? Math.round((p.answered / p.total) * 100) : 0;
          return `
            <button class="exam-card" data-exam-id="${exam.id}">
              <div class="exam-thumb">${exam.icon || "📘"}</div>
              <div class="exam-body">
                <div class="exam-tags">
                  <span class="tag subject">${escapeHtml(exam.subject)}</span>
                  <span class="tag topic">${escapeHtml(exam.topic)}</span>
                </div>
                <div class="exam-title">${escapeHtml(exam.title)}</div>
                <div class="exam-meta">
                  ${p.answered > 0
                    ? `${p.answered} / ${p.total} answered · ${p.correct} correct`
                    : `${p.total} questions`}
                </div>
                ${p.answered > 0 ? `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>` : ""}
              </div>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-dim);flex-shrink:0;"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          `;
        }).join("");
    attachExamCardHandlers();
  });

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      state.activeTab = tab.dataset.tab;
      renderHome();
    });
  });

  attachExamCardHandlers();
}

function attachExamCardHandlers() {
  document.querySelectorAll(".exam-card").forEach(card => {
    card.addEventListener("click", () => {
      const exam = QUIZ_DATA.find(e => e.id === card.dataset.examId);
      if (!exam) return;
      state.exam = exam;
      state.qIndex = 0;
      state.showExplanation = false;
      state.view = "quiz";
      render();
      window.scrollTo(0, 0);
    });
  });
}

function renderQuiz() {
  const exam = state.exam;
  const q = exam.questions[state.qIndex];
  const progress = state.progress[exam.id] || {};
  const savedAnswer = progress[state.qIndex];
  const answered = !!savedAnswer;
  const isCorrect = answered && savedAnswer.correct;

  const optionsHTML = q.options.map(opt => {
    let cls = "option";
    if (answered) {
      cls += " locked";
      if (opt.letter === q.correct) cls += " correct";
      else if (opt.letter === savedAnswer.chosen) cls += " wrong";
    }
    return `
      <button class="${cls}" data-letter="${opt.letter}">
        <span class="letter">${opt.letter}</span>
        <span>${escapeHtml(opt.text)}</span>
      </button>
    `;
  }).join("");

  const qNavHTML = exam.questions.map((_, i) => {
    const p = progress[i];
    let cls = "q-nav-btn";
    if (i === state.qIndex) cls += " current";
    else if (p) cls += p.correct ? " answered-correct" : " answered-wrong";
    return `<button class="${cls}" data-qnav="${i}">${i + 1}</button>`;
  }).join("");

  const relatedHTML = q.related && q.related.length
    ? `<div class="related">Related ${q.related.map(r => `<button class="related-btn">${escapeHtml(r)}</button>`).join("")}</div>`
    : "";

  app.innerHTML = `
    <div class="quiz-header">
      <button class="icon-btn" id="backBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="quiz-header-info">
        <div class="quiz-header-title">${escapeHtml(exam.title)}</div>
        <div class="quiz-header-count">${state.qIndex + 1} / ${exam.questions.length}</div>
      </div>
      <button class="icon-btn" id="closeBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="quiz-body">
      <div class="breadcrumb">${escapeHtml(exam.subject.toUpperCase())} <span class="dot">·</span> PASTYEAR QUIZ</div>
      <div class="quiz-title">${escapeHtml(exam.title)}</div>
      <div class="quiz-section">${escapeHtml(exam.section || "")}</div>

      <div class="q-tag-row">
        <div>
          <span class="q-number">Q${state.qIndex + 1}</span>
          <span class="q-topic">${escapeHtml(exam.topic)}</span>
        </div>
      </div>

      <div class="q-text">${escapeHtml(q.q)}</div>
      <div class="options">${optionsHTML}</div>

      ${answered ? `
        <div class="result-row ${isCorrect ? "correct" : "wrong"}">
          ${isCorrect ? "✓ Correct" : "✗ Incorrect"}
        </div>
        <div class="action-btns">
          <button class="action-btn ${state.showExplanation ? "active" : ""}" id="explBtn">Explanation</button>
        </div>
        ${state.showExplanation ? `
          <div class="explanation">
            <div class="explanation-label">Explanation</div>
            <div class="explanation-text">${q.explanation || "No explanation provided."}</div>
          </div>
        ` : ""}
        ${relatedHTML}
      ` : ""}

      <div class="q-nav">${qNavHTML}</div>

      <div class="nav-buttons">
        <button class="nav-btn" id="prevBtn" ${state.qIndex === 0 ? "disabled" : ""}>← Previous</button>
        <button class="nav-btn primary" id="nextBtn" ${state.qIndex === exam.questions.length - 1 ? "disabled" : ""}>Next →</button>
      </div>
    </div>
  `;

  // events
  document.getElementById("backBtn").addEventListener("click", () => {
    state.view = "home";
    state.exam = null;
    render();
  });
  document.getElementById("closeBtn").addEventListener("click", () => {
    state.view = "home";
    state.exam = null;
    render();
  });

  if (!answered) {
    document.querySelectorAll(".option").forEach(opt => {
      opt.addEventListener("click", () => {
        const chosen = opt.dataset.letter;
        if (!state.progress[exam.id]) state.progress[exam.id] = {};
        state.progress[exam.id][state.qIndex] = {
          chosen,
          correct: chosen === q.correct
        };
        saveProgress();
        state.showExplanation = false;
        renderQuiz();
      });
    });
  }

  const explBtn = document.getElementById("explBtn");
  if (explBtn) {
    explBtn.addEventListener("click", () => {
      state.showExplanation = !state.showExplanation;
      renderQuiz();
    });
  }

  document.querySelectorAll("[data-qnav]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.qIndex = parseInt(btn.dataset.qnav);
      state.showExplanation = false;
      renderQuiz();
      window.scrollTo(0, 0);
    });
  });

  document.getElementById("prevBtn").addEventListener("click", () => {
    if (state.qIndex > 0) {
      state.qIndex--;
      state.showExplanation = false;
      renderQuiz();
      window.scrollTo(0, 0);
    }
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    if (state.qIndex < exam.questions.length - 1) {
      state.qIndex++;
      state.showExplanation = false;
      renderQuiz();
      window.scrollTo(0, 0);
    }
  });
}

render();
</script>
